backend:
  name: github
  repo: liquid1188/urban-sophisticate-collective
  branch: main
media_folder: src/images
public_folder: /images
collections:
  - name: content
    label: Site content
    files:
      - name: notes
        label: Notes
        file: src/_data/notes.json
        fields:
          - { name: notes, label: Notes, widget: list, fields: [ { name: slug, label: Slug }, { name: title, label: Title }, { name: kicker, label: Kicker }, { name: image, label: Image, widget: image }, { name: q, label: Question, required: false }, { name: asker, label: Asked by, required: false }, { name: body, label: Body, widget: text } ] }
      - name: packages
        label: Pricing
        file: src/_data/packages.json
        fields:
          - { name: intro, label: Intro, widget: text }
          - { name: note, label: Pricing note, widget: text }
          - { name: packages, label: Packages, widget: list, fields: [ { name: name, label: Name }, { name: price, label: Price (leave blank to show "Ask"), required: false }, { name: for, label: Who it's for }, { name: body, label: Description, widget: text } ] }
      - name: testimonials
        label: Client words
        file: src/_data/testimonials.json
        fields:
          - { name: testimonials, label: Testimonials, widget: list, fields: [ { name: quote, label: Quote, widget: text }, { name: name, label: Name (first name is fine) }, { name: detail, label: Detail (e.g. attorney, Hyde Park), required: false } ] }
      - name: site
        label: Site settings
        file: src/_data/site.json
        fields:
          - { name: name, label: Name }
          - { name: tagline, label: Tagline }
          - { name: email, label: Email }
          - { name: territory, label: Territory line }
          - { name: instagram, label: Instagram URL }
          - { name: substack, label: Substack URL }
          - { name: substackName, label: Substack name }
          - { name: calendly, label: "Calendly link (paste to enable online booking)", required: false }
          - { name: url, label: Site URL }
          - { name: setupMode, label: Setup mode (noindex), widget: boolean }
      - name: trusted
        label: Trusted by
        file: src/_data/trusted.json
        fields:
          - { name: line, label: Line }
          - { name: items, label: Logos (upload a logo, or type a name to show text instead), widget: list, fields: [ { name: name, label: Name (used as alt text; type "Logo here" for a placeholder box) }, { name: logo, label: Logo image (PNG or SVG, transparent background), widget: image, required: false } ] }
      - name: partners
        label: Partners and sponsors
        file: src/_data/partners.json
        fields:
          - { name: partners, label: Partners, widget: list, fields: [ { name: name, label: Name }, { name: detail, label: Detail, required: false }, { name: url, label: URL, required: false }, { name: logo, label: Logo, widget: image, required: false }, { name: image, label: Photo, widget: image, required: false }, { name: status, label: Status, widget: select, options: [confirmed, proposed], default: confirmed } ] }
      - name: follows
        label: Recommended follows
        file: src/_data/follows.json
        fields:
          - { name: intro, label: Intro }
          - { name: follows, label: Accounts, widget: list, fields: [ { name: name, label: Name }, { name: handle, label: Instagram handle (no @) }, { name: url, label: URL }, { name: note, label: Why, widget: text } ] }
      - name: copy
        label: Homepage and footer text
        file: src/_data/copy.json
        fields:
          - name: hero
            label: Homepage hero
            widget: object
            fields:
              - { name: title, label: Headline }
              - { name: lede, label: Intro paragraph, widget: text }
              - { name: primary, label: Main button text }
              - { name: secondary, label: Second button text }
          - name: cta
            label: Bottom "Ready when you are" band (every page)
            widget: object
            fields:
              - { name: kicker, label: Small line above the headline }
              - { name: title, label: Headline }
              - { name: lede, label: Paragraph, widget: text }
          - name: newsletter
            label: Homepage newsletter section
            widget: object
            fields:
              - { name: kicker, label: Small line above the heading }
              - { name: lede, label: Paragraph, widget: text }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: tagline, label: Tagline (shown before the city) }
              - { name: appointment, label: Text after the city (e.g. "by appointment.") }
              - { name: newsletterHeading, label: Newsletter heading }
              - { name: newsletterBlurb, label: Newsletter blurb, widget: text }
      - name: looks
        label: Lookbook
        file: src/_data/looks.json
        fields:
          - { name: items, label: Looks, widget: list, fields: [ { name: src, label: Photo, widget: image }, { name: alt, label: Alt text (describe the outfit) }, { name: credit, label: Caption }, { name: w, label: Width in pixels, widget: number, required: false }, { name: h, label: Height in pixels, widget: number, required: false } ] }
      - name: reels
        label: Reels
        file: src/_data/reels.json
        fields:
          - { name: items, label: Reels, widget: list, fields: [ { name: slug, label: Slug (short, lowercase, hyphens) }, { name: title, label: Title }, { name: note, label: Note, widget: text }, { name: poster, label: Poster image, widget: image }, { name: src, label: Video file path or URL }, { name: placeholder, label: Placeholder (hide until real video is added), widget: boolean, default: false } ] }
